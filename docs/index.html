<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 96 Open Codes of Remark 2.33</title>
<meta name="description" content="Interactive viewer for the convexity of the 96 open 5-maximal neural codes on 6 neurons (Remark 2.33). Zaid Mohammed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060A; --panel:#0B0F17; --line:#1F2937; --text:#E5E7EB; --muted:#9CA3AF; --dim:#6B7280;
  --flat:#A3E635; --three:#22D3EE; --maybe:#818CF8; --non:#FB7185; --open:#4B5563;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif}
button{font:inherit;color:inherit}
a{color:var(--three);text-decoration:none} a:hover{text-decoration:underline}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{border-bottom:1px solid var(--line);padding:14px 20px 12px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.005em}
.byline{color:var(--muted);font-size:12.5px;margin-top:2px}
nav{display:flex;gap:16px;font-size:13.5px;padding-top:3px;white-space:nowrap}
nav button{background:none;border:0;color:var(--three);cursor:pointer;padding:0}
nav button:hover{text-decoration:underline}
.progress{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:11px;gap:1px}
.counts{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--muted);margin-top:6px}
.counts span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
main{display:grid;grid-template-columns:250px 1fr;min-height:0}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:12px 12px 8px}
.chip{background:#111827;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.chip.on{color:var(--text);border-color:#4B5563;background:#1F2937}
#search{margin:0 12px 8px;background:#0B0F17;border:1px solid var(--line);border-radius:7px;padding:7px 10px;color:var(--text);font:inherit;font-size:13px;outline:none}
#search:focus{border-color:#4B5563}
#list{overflow:auto;padding:0 8px 12px;flex:1}
.row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13.5px;color:#D1D5DB}
.row:hover{background:#0F1520}
.row.sel{background:#162032;color:#fff}
.row .tag{margin-left:auto;font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.row .st{color:var(--dim);font-size:12px}
#right{display:grid;grid-template-rows:minmax(300px,1fr) auto;min-height:0}
#stage{position:relative;min-height:0;overflow:hidden}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#mapwrap{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:18px}
#mapwrap svg{width:100%;height:100%}
#maptip{position:absolute;left:18px;top:14px;font-size:12.5px;color:var(--muted);max-width:560px;line-height:1.45}
#tip{position:absolute;pointer-events:none;background:#0B0F17EE;border:1px solid #374151;border-radius:6px;padding:3px 8px;font-size:12.5px;display:none;white-space:nowrap}
#hint{position:absolute;right:14px;bottom:10px;font-size:11.5px;color:var(--dim)}
#viewbtns{position:absolute;right:14px;top:12px;display:flex;gap:6px;z-index:4}
#viewbtns button{background:#0F1520;border:1px solid #374151;border-radius:8px;color:#E5E7EB;min-width:36px;height:32px;padding:0 10px;cursor:pointer;font-size:14px}
#viewbtns button:hover{border-color:#22D3EE}
#viewbtns button.on{border-color:#22D3EE;color:#22D3EE}
@media (max-width:760px){#viewbtns{top:auto;bottom:34px;right:10px}}
#bar{border-top:1px solid var(--line);padding:12px 20px 14px;background:var(--panel);overflow:auto;max-height:46vh}
.title2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.title2 h2{font-size:17px;margin:0}
.badge{font-size:11.5px;border-radius:999px;padding:2px 10px;border:1px solid}
.a1{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.summary{color:#CBD5E1;font-size:13.5px;line-height:1.55;margin:7px 0 8px;max-width:980px}
.legend,.cws{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.lchip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-size:12.5px;cursor:pointer;background:#0F1520;transition:box-shadow .15s,border-color .15s,opacity .15s}
.lchip.off{opacity:.35}
.lchip.glow{border-color:currentColor;box-shadow:0 0 10px currentColor}
.lchip i{width:10px;height:10px;border-radius:3px;display:inline-block}
.cw{border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12.5px;cursor:pointer;background:#0F1520}
.cw.sel{border-color:#E5E7EB}
.lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-top:8px}
.wit{font-size:12.5px;color:#CBD5E1;margin-top:4px}
details{margin-top:8px;font-size:12.5px;color:#CBD5E1}
summary{cursor:pointer;color:var(--three)}
pre{background:#05060A;border:1px solid var(--line);border-radius:7px;padding:9px 11px;overflow:auto;font-size:12px;line-height:1.5;margin:6px 0}
ul.tried,ol.proof{margin:6px 0 2px 0;padding-left:20px;font-size:13px;line-height:1.6;color:#CBD5E1;max-width:980px}
.verify{margin-top:8px;font-size:12.5px}
#modal{position:fixed;inset:0;background:#000A;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:640px;max-height:85vh;overflow:auto;padding:22px 24px;line-height:1.6;font-size:14px;color:#D1D5DB}
#modal h3{margin:0 0 10px;font-size:17px;color:#fff}
#modal .x{float:right;background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}
#mobilePick{display:none}
@media (max-width:760px){
  main{grid-template-columns:1fr}
  aside{display:none}
  #mobilePick{display:block;position:absolute;z-index:5;top:10px;left:12px;width:calc(100% - 24px);background:#0B0F17;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:8px;font:inherit}
  #right{grid-template-rows:56vh auto}
  #bar{max-height:none}
  h1{font-size:16px} nav{gap:12px;font-size:12.5px}
  .top{flex-direction:column;gap:6px}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
<header>
  <div class="top">
    <div><h1>The 96 Open Codes of Remark 2.33</h1><div class="byline">Zaid Mohammed</div></div>
    <nav><button id="aboutBtn">About</button><a id="ghLink" href="https://github.com/NotItsMe/neural-codes-96">GitHub</a><a id="verifyLink" href="https://github.com/NotItsMe/neural-codes-96#verify-it-yourself">Verify</a></nav>
  </div>
  <div class="progress" id="progress"></div>
  <div class="counts" id="counts"></div>
</header>
<main>
  <aside>
    <div class="filters" id="filters"></div>
    <input id="search" placeholder="Search a code, e.g. 068" autocomplete="off">
    <div id="list"></div>
  </aside>
  <div id="right">
    <div id="stage">
      <select id="mobilePick"></select>
      <div id="mapwrap"><div id="maptip"></div><svg id="map"></svg></div>
      <div id="tip"></div>
      <div id="viewbtns"><button data-r="left" title="Turn left">⟲</button><button data-r="right" title="Turn right">⟳</button><button data-r="up" title="Look from above">↑</button><button data-r="down" title="Look from below">↓</button><button data-r="spin" id="spinBtn" title="Auto-spin on/off">Spin</button><button data-r="reset" title="Reset view">Reset</button></div>
      <div id="hint">drag to turn it any way · scroll to zoom · right-drag to slide · click a region or a codeword chip to light it up</div>
    </div>
    <div id="bar"></div>
  </div>
</main>
</div>
<div id="modal"><div class="box"><button class="x" id="closeAbout">×</button><div id="aboutText"></div></div></div>

<script type="module">
import * as THREE from 'three';
import { TrackballControls } from 'three/addons/controls/TrackballControls.js';

const NEURON = ['#22D3EE','#E879F9','#A3E635','#FBBF24','#FB7185','#818CF8'];
const STATUS = {
  flat:     {c:'#A3E635', label:'Convex, drawn flat',           short:'2D'},
  '3d':     {c:'#22D3EE', label:'Convex, needs exactly 3D',     short:'3D only'},
  '3dmaybe':{c:'#818CF8', label:'Convex in 3D, flat still open',short:'3D'},
  '4d':     {c:'#C084FC', label:'Convex in 4D, 3D still open',  short:'4D'},
  nonconvex:{c:'#FB7185', label:'Not convex',                   short:'not convex'},
  open:     {c:'#6B7280', label:'Open',                         short:'open'},
};
const ORDER = ['flat','3d','3dmaybe','4d','nonconvex','open'];
const FILTERS = [['all','All'],['flat','Flat'],['3d','3D'],['nonconvex','Not convex'],['open','Open']];

const DATA = await (await fetch('data.json')).json();
const byId = Object.fromEntries(DATA.codes.map(c=>[c.id,c]));
const $ = id => document.getElementById(id);

/* ---------- header ---------- */
$('progress').innerHTML = ORDER.map(k=>`<div title="${STATUS[k].label}: ${DATA.counts[k]||0}" style="background:${STATUS[k].c};flex:${DATA.counts[k]||0}"></div>`).join('');
$('counts').innerHTML = ORDER.map(k=>`<span><i class="dot" style="background:${STATUS[k].c}"></i>${STATUS[k].label} · ${DATA.counts[k]||0}</span>`).join('');

/* ---------- about ---------- */
$('aboutText').innerHTML = document.getElementById('about-src').innerHTML;
$('aboutBtn').onclick = ()=> $('modal').style.display='flex';
$('closeAbout').onclick = ()=> $('modal').style.display='none';
$('modal').onclick = e=>{ if(e.target.id==='modal') $('modal').style.display='none'; };

/* ---------- sidebar ---------- */
let filter = 'all', query = '', current = null;
$('filters').innerHTML = FILTERS.map(([k,l])=>`<button class="chip${k==='all'?' on':''}" data-f="${k}">${l}</button>`).join('');
$('filters').onclick = e=>{ const b=e.target.closest('.chip'); if(!b) return; filter=b.dataset.f;
  [...$('filters').children].forEach(x=>x.classList.toggle('on',x===b)); renderList(); };
$('search').oninput = e=>{ query=e.target.value.trim().toLowerCase(); renderList(); };
function matches(c){
  const f = filter==='all' || c.status===filter || (filter==='3d' && (c.status==='3dmaybe'||c.status==='4d'));
  return f && (!query || c.id.toLowerCase().includes(query));
}
function renderList(){
  $('list').innerHTML = DATA.codes.filter(matches).map(c=>`<div class="row${c.id===current?' sel':''}" data-id="${c.id}">
    <i class="dot" style="background:${STATUS[c.status].c}"></i>${c.id} <span class="st">· ${STATUS[c.status].short}</span>
    ${c.a1?`<span class="tag">A.1 #${c.a1}</span>`:''}</div>`).join('');
}
$('list').onclick = e=>{ const r=e.target.closest('.row'); if(r) select(r.dataset.id); };
$('mobilePick').innerHTML = DATA.codes.map(c=>`<option value="${c.id}">${c.id} · ${STATUS[c.status].short}${c.a1?` · A.1 #${c.a1}`:''}</option>`).join('');
$('mobilePick').onchange = e=> select(e.target.value);

/* ---------- three.js stage ---------- */
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setClearColor(0x05060a);
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x05060a, 16, 34);
const cam = new THREE.PerspectiveCamera(40, 1, .05, 200);
scene.add(new THREE.AmbientLight(0xffffff,.6));
const sun = new THREE.DirectionalLight(0xffffff,1.0); sun.position.set(6,10,8); scene.add(sun);
const grid = new THREE.GridHelper(16, 32, 0x334155, 0x1e293b); scene.add(grid);
const controls = new TrackballControls(cam, renderer.domElement);
controls.rotateSpeed = 3; controls.zoomSpeed = 1.2; controls.panSpeed = .6; controls.dynamicDampingFactor = .15;
let spin = true; const spinBtn = ()=>document.getElementById('spinBtn');
controls.addEventListener('start', ()=>{ spin=false; spinBtn()?.classList.remove('on'); });
let world = new THREE.Group(); scene.add(world);
let regionObjs = {}, hlObj = null, witnessObj = null, model = null; // model: {code, dim, toWorld}

function resize(){ const r=stage.getBoundingClientRect(); controls?.handleResize?.(); renderer.setSize(r.width, r.height, false); cam.aspect=r.width/Math.max(1,r.height); cam.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);

function blend(word){
  const cs=[...word].map(ch=>new THREE.Color(NEURON[+ch-1]));
  const c=new THREE.Color(0,0,0); cs.forEach(x=>c.add(x)); c.multiplyScalar(1/cs.length);
  const hsl={}; c.getHSL(hsl); return new THREE.Color().setHSL(hsl.h, 1, .6);
}
function polyGeo(shape, dim){
  if(dim===3){
    const P=shape.points.map(p=>new THREE.Vector3(...p)); const cen=new THREE.Vector3(); P.forEach(p=>cen.add(p)); cen.multiplyScalar(1/P.length);
    const pos=[];
    shape.faces.forEach(([a,b,c])=>{ const n=new THREE.Vector3().subVectors(P[b],P[a]).cross(new THREE.Vector3().subVectors(P[c],P[a]));
      const tri = n.dot(new THREE.Vector3().subVectors(P[a],cen))>0 ? [a,b,c] : [a,c,b];
      tri.forEach(i=>pos.push(P[i].x,P[i].y,P[i].z)); });
    const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3)); g.computeVertexNormals(); return g;
  }
  return new THREE.ShapeGeometry(new THREE.Shape(shape.points.map(p=>new THREE.Vector2(p[0],p[1]))));
}
function clearWorld(){ scene.remove(world); world.traverse(o=>{o.geometry?.dispose(); o.material?.dispose?.();}); world=new THREE.Group(); scene.add(world); regionObjs={}; hlObj=null; witnessObj=null; }

function buildModel(code){
  clearWorld();
  const dim = code.dim;
  const inner = new THREE.Group(); world.add(inner);
  Object.entries(code.shapes).forEach(([n,sh])=>{
    const col=new THREE.Color(NEURON[+n-1]);
    const geo=polyGeo(sh,dim);
    const mat = dim===3
      ? new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.35,transparent:true,opacity:.3,side:THREE.DoubleSide,depthWrite:false})
      : new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.22,side:THREE.DoubleSide,depthWrite:false});
    const mesh=new THREE.Mesh(geo,mat); mesh.userData.neuron=+n;
    let edges;
    if(dim===3) edges=new THREE.LineSegments(new THREE.EdgesGeometry(geo,20), new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.9}));
    else { const pts=sh.points.map(p=>new THREE.Vector3(p[0],p[1],0)); pts.push(pts[0].clone());
      edges=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.95})); }
    const z = dim===2 ? (+n)*0.003 : 0; mesh.position.z=z; edges.position.z=z;
    inner.add(mesh); inner.add(edges); regionObjs[n]={mesh,edges,mat,col};
  });
  // fit: center, scale to ~5 units, lay 2D drawings on the floor
  const box=new THREE.Box3().setFromObject(inner), size=box.getSize(new THREE.Vector3()), c=box.getCenter(new THREE.Vector3());
  const scale = 5/Math.max(size.x,size.y,size.z||0.001);
  inner.position.copy(c).multiplyScalar(-1);
  const holder=new THREE.Group(); holder.add(inner); world.add(holder); holder.scale.setScalar(scale);
  cam.up.set(0,1,0);
  if(dim===2){ holder.rotation.x=-Math.PI/2; holder.position.y=.02; cam.position.set(0,9.5,3.2); controls.target.set(0,0,0); }
  else { holder.position.y=size.y*scale/2+.05; cam.position.set(7,5.4,7.6); controls.target.set(0,size.y*scale/2,0); }
  controls.update();
  model={code,dim,inner,holder};
  homeView={pos:cam.position.clone(), up:cam.up.clone(), target:controls.target.clone(), rotY:holder.rotation.y};
}

/* point -> codeword (exact test against the inequalities, in drawing coordinates) */
function patternAt(p){
  const code=model.code, out=[];
  for(const [n,r] of Object.entries(code.inequalities)){
    let inside=true;
    code.dirs.forEach(d=>{ const k=d.join(','), v=d.reduce((s,a,i)=>s+a*p[i],0); const [lo,hi]=r[k]; if(!(v>lo+1e-9 && v<hi-1e-9)) inside=false; });
    if(inside) out.push(n);
  }
  return out.sort().join('');
}

function setHighlight(word){
  if(hlObj){ model.inner.remove(hlObj); hlObj.traverse(o=>{o.geometry?.dispose(); o.material?.dispose?.();}); hlObj=null; }
  if(witnessObj){ model.inner.remove(witnessObj); witnessObj=null; }
  const active = word ? new Set([...word]) : null;
  Object.entries(regionObjs).forEach(([n,o])=>{
    const on = !hidden.has(+n);
    o.mesh.visible=on; o.edges.visible=on;
    const dimmed = active && !active.has(n);
    o.mat.opacity = dimmed ? .04 : (active ? .12 : (model.dim===3?.3:.22));
    o.edges.material.opacity = dimmed ? .12 : .9;
  });
  document.querySelectorAll('.lchip').forEach(ch=>ch.classList.toggle('glow', !!active && active.has(ch.dataset.n)));
  document.querySelectorAll('.cw').forEach(ch=>ch.classList.toggle('sel', ch.dataset.w===word));
  $('wit').innerHTML = '';
  if(!word) return;
  const cell = model.code.cells[word];
  const col = blend(word);
  if(cell){
    const geo=polyGeo(cell, model.dim);
    const g=new THREE.Group();
    const mat = model.dim===3
      ? new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.9,transparent:true,opacity:.75,side:THREE.DoubleSide,depthWrite:false})
      : new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.75,side:THREE.DoubleSide,depthWrite:false});
    const m=new THREE.Mesh(geo,mat); if(model.dim===2) m.position.z=.03; g.add(m);
    if(model.dim===3) g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo,20), new THREE.LineBasicMaterial({color:col})));
    model.inner.add(g); hlObj=g;
  }
  const w = model.code.witness[word];
  if(w){
    const p = w.map(x=>{ const [a,b]=x.split('/'); return b? (+a)/(+b) : +a; });
    const s=new THREE.Mesh(new THREE.SphereGeometry(.09/model.holder.scale.x*1.0,20,14), new THREE.MeshBasicMaterial({color:0xffffff}));
    s.position.set(p[0],p[1],model.dim===3?p[2]:.05); model.inner.add(s); witnessObj=s;
    $('wit').innerHTML = `Codeword <b>${word}</b> fires at exactly the point (${w.join(', ')}), shown as the white dot. The glowing shape is where neurons ${[...word].join(', ')} all overlap; other regions may cut into it.`;
  }
}

/* clicking in the viewer */
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
let downAt=null;
renderer.domElement.addEventListener('pointerdown', e=>{ downAt=[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointerup', e=>{
  if(!model || !downAt) return; if(Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>5) return;
  const r=renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,cam);
  const meshes=Object.entries(regionObjs).filter(([n])=>!hidden.has(+n)).map(([,o])=>o.mesh);
  const hits=ray.intersectObjects(meshes,false);
  let word='';
  const inv=new THREE.Matrix4().copy(model.inner.matrixWorld).invert();
  if(model.dim===2 && hits.length){
    const p=hits[0].point.clone().applyMatrix4(inv); word=patternAt([p.x,p.y]);
  } else if(hits.length){
    const ds=[...new Set(hits.map(h=>+h.distance.toFixed(6)))].sort((a,b)=>a-b);
    for(let i=0;i<ds.length-1 && !word;i++){
      const p=ray.ray.at((ds[i]+ds[i+1])/2,new THREE.Vector3()).applyMatrix4(inv); word=patternAt([p.x,p.y,p.z]);
    }
  }
  if(word && model.code.codewords.includes(word)){
    setHighlight(word);
    const tip=$('tip'); tip.style.display='block'; tip.textContent='codeword '+word;
    tip.style.left=(e.clientX-r.left+12)+'px'; tip.style.top=(e.clientY-r.top+12)+'px';
  } else { setHighlight(null); $('tip').style.display='none'; }
});

let hidden=new Set();
function rotateView(axis, ang){
  const off = cam.position.clone().sub(controls.target);
  if(axis==='y') off.applyAxisAngle(cam.up, ang);
  else { const right = new THREE.Vector3().crossVectors(cam.up, off).normalize(); off.applyAxisAngle(right, ang); cam.up.applyAxisAngle(right, ang); }
  cam.position.copy(controls.target).add(off); cam.lookAt(controls.target);
}
let homeView=null;
document.getElementById('viewbtns').onclick = e=>{
  const b=e.target.closest('button'); if(!b||!model) return; const r=b.dataset.r, step=Math.PI/6;
  if(r==='spin'){ spin=!spin; b.classList.toggle('on',spin); return; }
  if(r==='reset'){ cam.position.copy(homeView.pos); cam.up.copy(homeView.up); controls.target.copy(homeView.target); model.holder.rotation.y=homeView.rotY; cam.lookAt(controls.target); return; }
  spin=false; spinBtn().classList.remove('on');
  if(r==='left') rotateView('y', -step); if(r==='right') rotateView('y', step);
  if(r==='up') rotateView('x', step); if(r==='down') rotateView('x', -step);
};
function loop(){ requestAnimationFrame(loop); if(spin && model && model.dim===3) model.holder.rotation.y += .004; controls.update(); renderer.render(scene,cam); }
loop();

/* ---------- codeword map (no drawing) ---------- */
function drawMap(code){
  const svg=$('map'), W=900, H=430; svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const ns='http://www.w3.org/2000/svg';
  svg.innerHTML='<defs><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="430"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
  const words=code.map.words, layers={}; words.forEach(w=>(layers[w.length]??=[]).push(w));
  const lv=Object.keys(layers).map(Number).sort((a,b)=>a-b), pos={};
  lv.forEach((L,i)=>{ const row=layers[L], y=H-55-i*((H-130)/Math.max(1,lv.length-1)); row.forEach((w,j)=>pos[w]=[(W/(row.length+1))*(j+1),y]); });
  const np=code.notPlanar, petals=np?new Set(np.petals):new Set(), center=np?.center;
  const isP=w=>petals.has(w)||w===center;
  const el=(t,a,txt)=>{const e=document.createElementNS(ns,t); for(const k in a) e.setAttribute(k,a[k]); if(txt!=null) e.textContent=txt; svg.appendChild(e); return e;};
  code.map.edges.forEach(([a,b])=>{ const hl=np && petals.has(a) && b===center;
    el('line',{x1:pos[a][0],y1:pos[a][1],x2:pos[b][0],y2:pos[b][1],stroke:hl?'#E879F9':'#334155','stroke-width':hl?2.6:1.2,filter:hl?'url(#glow)':''}); });
  words.forEach(w=>{ const [x,y]=pos[w], hl=isP(w), c='#'+blend(w).getHexString(), mx=code.maximal.includes(w);
    el('circle',{cx:x,cy:y,r:hl?20:17,fill:hl?c:'#0F172A',stroke:c,'stroke-width':mx?2.6:1.6,filter:hl?'url(#glow)':''});
    el('text',{x,y:y+4.5,'text-anchor':'middle','font-size':13,'font-weight':600,fill:hl?'#05060A':'#E5E7EB','font-family':'Space Grotesk'},w); });
  $('maptip').innerHTML = `Codeword map: each circle is a codeword, bottom row smallest; a line means the smaller codeword sits inside the bigger one.`
    + (np ? ` Glowing: regions ${np.petals.join(', ')} only ever overlap inside ${center}, which is why this code cannot be drawn flat.` : '');
}

/* ---------- select a code ---------- */
function select(id){
  current=id; const c=byId[id]; hidden=new Set(); renderList(); $('mobilePick').value=id;
  history.replaceState(null,'','#'+id);
  const st=STATUS[c.status];
  const hasDrawing=!!c.shapes;
  renderer.domElement.style.display = hasDrawing?'block':'none';
  $('mapwrap').style.display = hasDrawing?'none':'flex';
  $('hint').style.display = hasDrawing?'block':'none'; $('viewbtns').style.display = hasDrawing?'flex':'none';
  $('tip').style.display='none';
  if(hasDrawing){ buildModel(c); spin = c.dim===3; spinBtn().classList.toggle('on',spin); spinBtn().style.display = c.dim===3?'':'none'; resize(); controls.handleResize(); } else { model=null; drawMap(c); }

  let html=`<div class="title2"><h2>${c.id}</h2><span class="badge" style="color:${st.c};border-color:${st.c}">${st.label}</span>${c.a1?`<span class="a1">Appendix A.1 #${c.a1}</span>`:''}</div>
  <div class="summary">${c.summary}</div>`;
  if(hasDrawing){
    html+=`<div class="lbl">Neurons (click to hide)</div><div class="legend">${[1,2,3,4,5,6].map(n=>`<span class="lchip" data-n="${n}" style="color:${NEURON[n-1]}"><i style="background:${NEURON[n-1]}"></i><span style="color:#E5E7EB">neuron ${n}</span></span>`).join('')}</div>
    <div class="lbl">Codewords (click one to light it up)</div><div class="cws">${c.codewords.filter(w=>w!=='∅').map(w=>`<span class="cw" data-w="${w}">${w}</span>`).join('')}</div>
    <div class="wit" id="wit"></div>
    <div class="verify">Verify this code: certificate <a href="https://github.com/NotItsMe/neural-codes-96/blob/main/data/certificates/${c.certFile}">${c.certFile}</a> · <code>python3 checker/verify.py ${c.id}</code></div>
    <details><summary>Exact regions (inequalities)</summary><pre>${Object.entries(c.inequalities).map(([n,r])=>`U${n}: `+Object.entries(r).map(([k,[lo,hi]])=>`${lo} < ${dirLabel(k)} < ${hi}`).join(',  ')).join('\n')}</pre></details>
    <details><summary>Witness points (one exact point per codeword)</summary><pre>${Object.entries(c.witness).map(([w,p])=>`${w.padEnd(5)} (${p.join(', ')})`).join('\n')}</pre></details>`;
  } else {
    html+=`<div class="wit" id="wit"></div>`;
    if(c.drawing4d) html+=`<div class="lbl">The 4D drawing (coordinates x, y, z, w)</div><ol class="proof">${c.drawing4d.map(p=>`<li>${p}</li>`).join('')}</ol><div class="verify">Verify: <code>python3 checker/verify.py ${c.id}</code></div>`;
    if(c.proof) html+=`<div class="lbl">${c.summary.includes('New result')?'Proof (new, Nov 2026; full write-up in docs/proofs.md)':'Proof (Prabhakar 2026; reproduced here)'}</div><ol class="proof">${c.proof.map(p=>`<li>${p}</li>`).join('')}</ol>`;
    if(c.tried) html+=`<div class="lbl">What we tried</div><ul class="tried">${c.tried.map(t=>`<li>${t}</li>`).join('')}</ul>`;
    html+=`<div class="lbl">Codewords</div><div class="summary">${c.codewords.join('  ')}</div>`;
  }
  $('bar').innerHTML=html;
  document.querySelectorAll('.lchip').forEach(ch=>ch.onclick=()=>{ const n=+ch.dataset.n; hidden.has(n)?hidden.delete(n):hidden.add(n); ch.classList.toggle('off',hidden.has(n)); setHighlight(document.querySelector('.cw.sel')?.dataset.w||null); });
  document.querySelectorAll('.cw').forEach(ch=>ch.onclick=()=>{ const w=ch.dataset.w; setHighlight(ch.classList.contains('sel')?null:w); });
}
function dirLabel(k){
  const d=k.split(',').map(Number), v=['x','y','z'];
  return d.map((a,i)=>a===0?'':(a===1?'+':a===-1?'−':(a>0?'+':'−')+Math.abs(a))+v[i]).join('').replace(/^\+/,'') || '0';
}

renderList();
select(location.hash && byId[location.hash.slice(1)] ? location.hash.slice(1) : 'C5-068');
window.READY=true;
</script>

<template id="about-src">
<h3>About this project</h3>
<p>A neural code is a list of which neurons fire together. Place cells in the brain each fire when an animal is in one patch of space, called its place field. If every place field is a convex shape (no dents or holes), the code that comes out is called convex. Researchers want to know which codes can come from convex place fields and which can't.</p>
<p>In 2025, Ahmed, Crepeau, Flores, Isekenegbe, Perez and Shiu pointed to 96 small codes, each with 6 neurons and 5 maximal codewords, whose convexity nobody knew (Remark 2.33 of arXiv:2510.20323, building on the Wheels paper of Ruys de Perez, Matusevich and Shiu). This site shows where each of the 96 stands.</p>
<p>For 85 of them I found actual drawings: convex shapes that produce exactly the right code, each one checked exactly by computer. 63 fit in the plane. 19 cannot fit in the plane at all (I prove this with Jeffs' sunflower theorem) but do fit in 3D, so they need exactly three dimensions. One (C5-086) is drawn in 4D. Eleven codes are not convex. Three of those were first shown by Prayagh Prabhakar in 2026 and are reproduced here, and the other eight are new. That settles all 96.</p>
<p>The eight new ones come from new arguments (the Rim rule, the Six-Role Wall, and two crossing-point arguments), and the full proofs are on GitHub in docs/proofs.md. Every drawing on this site comes with its exact numbers, so anyone can check the results themselves.</p>
</template>
